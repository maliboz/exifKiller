name: Bug Report
description: Report an issue with scanning, cleaning, verification, or packaging.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - GUI
        - Cleaner Engine
        - Verification
        - Reporting
        - Packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, file types, and steps to reproduce.
    validations:
      required: true
