name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy
      - name: Pytest
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pip-audit scans the whole environment, so the runner's own preinstalled
      # setuptools counts. It ships an old one (PYSEC-2026-3447), which has
      # nothing to do with this project's dependencies - upgrade it rather than
      # suppress the finding.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
      - name: pip-audit
        run: pip-audit
