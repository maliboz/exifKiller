name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          # This repository currently cannot upload SARIF to GitHub Code
          # Scanning. Run CodeQL anyway and keep the SARIF as a workflow
          # artifact, so a disabled repository feature does not make CI red.
          upload: never
      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}/*.sarif
          if-no-files-found: error
