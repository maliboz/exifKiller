name: Release Portable Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Build portable app
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onedir
          --name ExifKiller
          --add-data "logo.png;."
          --hidden-import tkinterdnd2
          --hidden-import customtkinter
          main.py
      - name: Package build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ExifKiller\* -DestinationPath dist\ExifKiller-windows-x64.zip -Force
          (Get-FileHash dist\ExifKiller-windows-x64.zip -Algorithm SHA256).Hash + "  ExifKiller-windows-x64.zip" | Set-Content dist\sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exif-killer-windows-x64
          path: |
            dist/ExifKiller-windows-x64.zip
            dist/sha256sums.txt
